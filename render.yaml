services:
  - type: web
    name: budget-monitor
    runtime: node
    # A paid instance: the free tier sleeps when idle, which would stop the daily scan.
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
